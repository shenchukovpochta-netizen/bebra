# Ни портов наружу, ни веб-сервера, ни сертификата: бот работает на long polling,
# входящие соединения ему не нужны вообще.

secrets:
  db_password:
    file: ./secrets/db_password
  bot_token:
    file: ./secrets/bot_token
  # Ключ шифрования анкеты. Отдельным файлом, чтобы дамп базы без него
  # ничего не давал: паспортные данные лежат в bot.users зашифрованными.
  pdn_key:
    file: ./secrets/pdn_key
  # Токен бота в MAX. Нужен только сервису bot-max (профиль max);
  # без него профиль просто не поднимается.
  max_bot_token:
    file: ./secrets/max_bot_token
  # Доступ к кабинету StarLine: секрет приложения и пароль пользователя.
  # Файлы создаёт bootstrap.sh пустыми - без них compose не поднимется,
  # а пустые означают «трекеров нет», и опрос просто не запускается.
  starline_app_secret:
    file: ./secrets/starline_app_secret
  starline_password:
    file: ./secrets/starline_password
  # Токен открытого API Точки: выписка по счёту и чек 54-ФЗ.
  tochka_token:
    file: ./secrets/tochka_token
  # Секрет приложения API Авито: чаты объявлений - во «Входящие» панели.
  avito_client_secret:
    file: ./secrets/avito_client_secret
  # «Входящие»: ключ шифрования переписки (генерирует bootstrap.sh, в
  # бэкап - отдельно от базы) и токен хука /hook/inbox для шлюзов
  # WhatsApp и n8n (пустой - хука нет).
  inbox_key:
    file: ./secrets/inbox_key
  inbox_hook_token:
    file: ./secrets/inbox_hook_token
  wazzup_api_key:
    file: ./secrets/wazzup_api_key
  # Франшиза. franchise_key - ключ, которым франчайзер шифрует токены
  # своих франчайзи (генерирует bootstrap.sh, в бэкап - отдельно от базы).
  # metrics_token - токен адреса /hook/metrics этой копии для франчайзера
  # (пустой - адреса нет).
  franchise_key:
    file: ./secrets/franchise_key
  metrics_token:
    file: ./secrets/metrics_token
  # Ключ подписи cookie веб-панели и пароль её первого администратора.
  # Оба генерирует bootstrap.sh; пароль нужен только до первого входа.
  crm_secret:
    file: ./secrets/crm_secret
  crm_admin_password:
    file: ./secrets/crm_admin_password
  # Демо-стенд (профиль demo): пароль его базы и ключ подписи его cookie.
  # Свои, а не боевые: логин демо публичен. Оба генерирует bootstrap.sh -
  # и без профиля demo, иначе compose не поднимется вовсе.
  demo_db_password:
    file: ./secrets/demo_db_password
  crm_demo_secret:
    file: ./secrets/crm_demo_secret
  # Бэкап вне сервера: ключ шифрования копии (генерирует bootstrap.sh) и
  # секретный ключ доступа к бакету S3 (пустой - облако выключено).
  backup_key:
    file: ./secrets/backup_key
  backup_s3_secret:
    file: ./secrets/backup_s3_secret

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    secrets: [db_password]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mybike}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:-mybike}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mybike} -d $${POSTGRES_DB:-mybike}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Ежедневный дамп базы в ./backups с хранением BACKUP_KEEP_DAYS дней,
  # зашифрованная копия в облако S3 (если задан BACKUP_S3_BUCKET) и раз
  # в неделю проверка, что копия разворачивается. Вся логика - backup.sh,
  # итог шагов - в crm.settings (backup_status): его читают бот и панель.
  # Снапшоты VPS бэкап не заменяют: в них и секреты, и ключ анкеты.
  # Дамп без secrets/pdn_key паспортных данных не раскрывает.
  # Образ свой (backup.Dockerfile): postgres:16-alpine плюс rclone из
  # его официального образа.
  backup:
    build:
      context: .
      dockerfile: backup.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # backup_key шифрует копию до отправки: провайдер видит только шифр.
    # Потеря ключа = потеря облачных копий, поэтому он хранится и вне
    # сервера (INSTALL.md, «Бэкап вне сервера»).
    secrets: [db_password, backup_key, backup_s3_secret]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mybike}
      POSTGRES_DB: ${POSTGRES_DB:-mybike}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      # Облако S3 в России (Beget, Yandex Object Storage, Selectel).
      # Пустой бакет - копия не уходит, остальное работает как раньше.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-mybike}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_KEEP_DAYS: ${BACKUP_S3_KEEP_DAYS:-14}
      BACKUP_S3_KEEP_WEEKS: ${BACKUP_S3_KEEP_WEEKS:-8}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./backups:/backups
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  bot:
    build: .
    restart: unless-stopped
    # По умолчанию docker даёт на остановку 10 секунд, а бот при SIGTERM ещё
    # доводит фоновые задачи (сохранение скана, договор) - иначе их прибьёт SIGKILL.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    secrets: [db_password, bot_token, pdn_key, starline_app_secret,
              starline_password, tochka_token, max_bot_token, avito_client_secret,
              inbox_key, franchise_key, wazzup_api_key, inbox_hook_token]
    environment:
      # Секреты - через файлы: содержимое окружения видно в docker inspect,
      # в дампах процесса и в трейсбеках при падении.
      BOT_TOKEN_FILE: /run/secrets/bot_token
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PDN_KEY_FILE: /run/secrets/pdn_key
      STARLINE_APP_SECRET_FILE: /run/secrets/starline_app_secret
      STARLINE_PASSWORD_FILE: /run/secrets/starline_password
      TOCHKA_TOKEN_FILE: /run/secrets/tochka_token
      AVITO_CLIENT_SECRET_FILE: /run/secrets/avito_client_secret
      INBOX_KEY_FILE: /run/secrets/inbox_key
      # WhatsApp через Wazzup: ответы из «Входящих» и подписка хука панели
      # (адрес с токеном хука). Пустой ключ - выключено.
      WAZZUP_API_KEY_FILE: /run/secrets/wazzup_api_key
      INBOX_HOOK_TOKEN_FILE: /run/secrets/inbox_hook_token
      # Опрос франчайзи раз в сутки: токены лежат в базе шифротекстом.
      FRANCHISE_KEY_FILE: /run/secrets/franchise_key
      # Нужен ровно для рассылок: тем клиентам, у кого привязан MAX.
      # Пустой файл - такие получатели помечаются пропущенными.
      MAX_BOT_TOKEN_FILE: /run/secrets/max_bot_token

      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-mybike}
      POSTGRES_DB: ${POSTGRES_DB:-mybike}

      CHANNEL_ID: ${CHANNEL_ID}
      CHANNEL_URL: ${CHANNEL_URL}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID}
      ADMINS: ${ADMINS}

      # Кому уходит договор на утверждение и куда - подписанный.
      CONTRACT_CHAT_ID: ${CONTRACT_CHAT_ID}
      FIX_CHAT_ID: ${FIX_CHAT_ID}
      FIX_TOPIC_ID: ${FIX_TOPIC_ID}
      # Шаблоны монтируются файлами, а не запекаются в образ: документы
      # правят юрист и владелец проката, пересборка образа для этого не нужна.
      CONTRACT_TEMPLATE: /srv/app/contract_template.docx
      ACT_IN_TEMPLATE: /srv/app/act_priema_template.docx
      ACT_OUT_TEMPLATE: /srv/app/act_vozvrata_template.docx
      BUYOUT_TEMPLATE: /srv/app/act_vykup_template.docx
      # Согласие на обработку ПДн (приложение к договору) и Политика ПДн
      # (уходит файлом на шаге ознакомления; подставляются только
      # реквизиты оператора, файл без подстановок - как есть).
      SOGLASIE_TEMPLATE: /srv/app/soglasie_template.docx
      PDN_POLICY_FILE: /srv/app/pdn_policy.docx

      OFERTA_URL: ${OFERTA_URL}
      OFERTA_VERSION: ${OFERTA_VERSION}
      PDN_URL: ${PDN_URL}
      PDN_VERSION: ${PDN_VERSION}
      VIDEO_URL: ${VIDEO_URL}
      # Ссылка на оплату по расчётному счёту: этап оплаты, продление,
      # ответы про реквизиты.
      PAY_URL: ${PAY_URL}

      PURGE_APPROVED_DAYS: ${PURGE_APPROVED_DAYS:-90}
      PURGE_REJECTED_DAYS: ${PURGE_REJECTED_DAYS:-3}
      PURGE_STALE_DAYS: ${PURGE_STALE_DAYS:-30}
      UPDATES_LOG_DAYS: ${UPDATES_LOG_DAYS:-7}
      REMIND_BEFORE_DAYS: ${REMIND_BEFORE_DAYS:-2}
      REMIND_HOUR_UTC: ${REMIND_HOUR_UTC:-7}

      # Трекеры: опрос StarLine живёт в процессе бота - здесь уже есть
      # и расписание, и бот, которым уходят тревоги. Панель в интернет
      # не ходит и читает то, что опрос положил в базу.
      STARLINE_APP_ID: ${STARLINE_APP_ID}
      STARLINE_LOGIN: ${STARLINE_LOGIN}
      STARLINE_POLL_SECONDS: ${STARLINE_POLL_SECONDS:-300}

      # Счёт в Точке: выписка и чек 54-ФЗ. Тянет тоже бот - панель
      # в интернет не ходит.
      TOCHKA_ACCOUNT_ID: ${TOCHKA_ACCOUNT_ID}
      TOCHKA_CUSTOMER_CODE: ${TOCHKA_CUSTOMER_CODE}
      TOCHKA_POLL_SECONDS: ${TOCHKA_POLL_SECONDS:-1800}

      # Авито: чаты объявлений - во «Входящие» панели. Опрашивает тоже бот.
      AVITO_CLIENT_ID: ${AVITO_CLIENT_ID:-}
      AVITO_POLL_SECONDS: ${AVITO_POLL_SECONDS:-60}

      # Рабочая группа точек: формы в темах сверяются с CRM (бывший n8n).
      OPS_CHAT_ID: ${OPS_CHAT_ID:-}
      OPS_TOPIC_FIX: ${OPS_TOPIC_FIX:-}
      OPS_TOPIC_RETURN: ${OPS_TOPIC_RETURN:-}
      OPS_TOPIC_DEBT: ${OPS_TOPIC_DEBT:-}
      OPS_TOPIC_GPS: ${OPS_TOPIC_GPS:-}
      OPS_TOPIC_DAILY: ${OPS_TOPIC_DAILY:-}

      # Здоровье сервера: раз в час бот смотрит свободное место (на томе
      # kycfiles, это диск docker), отчёт сервиса backup, живость панели
      # по сети compose и срок сертификатов доменов - и пишет владельцу.
      CRM_DOMAIN: ${CRM_DOMAIN:-}
      DEMO_DOMAIN: ${DEMO_DOMAIN:-}
      HEALTH_PANEL_URL: http://crm:8080/healthz

      STORAGE_DIR: /files/kyc
      # Свои шаблоны документов и печать: их кладёт панель.
      DOC_TEMPLATE_DIR: /doctemplates
      # Фото при сдаче: оператор присылает их ответом на карточку сдачи,
      # бот кладёт на том снимков техники и чистит по сроку.
      BIKE_PHOTO_DIR: /bikes
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - kycfiles:/files
      # Свои шаблоны документов и печать: панель их кладёт, бот читает.
      - doctemplates:/doctemplates:ro
      # Снимки техники - на запись: фото при сдаче из служебного чата пишет
      # бот, и он же удаляет их по сроку дневным проходом. ПДн там нет.
      - bikefiles:/bikes
      # Правка документов не должна требовать пересборки образа.
      - ./app/contract_template.docx:/srv/app/contract_template.docx:ro
      - ./app/act_priema_template.docx:/srv/app/act_priema_template.docx:ro
      - ./app/act_vozvrata_template.docx:/srv/app/act_vozvrata_template.docx:ro
      - ./app/act_vykup_template.docx:/srv/app/act_vykup_template.docx:ro
      - ./app/soglasie_template.docx:/srv/app/soglasie_template.docx:ro
      - ./app/pdn_policy.docx:/srv/app/pdn_policy.docx:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Веб-панель CRM: клиенты, парк, аренды, тарифы, деньги. Свой процесс
  # и свой порт, база общая с ботом (схема crm). Токен бота ей нужен
  # только для уведомлений клиентам о зачислении и аренде.
  # Слушает 127.0.0.1 сервера: наружу не торчит, вход через SSH-туннель
  # или через профиль https с доменом (см. CRM.md).
  crm:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.web"]
    # Панель смотрит в интернет, а память у неё общая с базой и ботом:
    # тяжёлый запрос должен упереться в свой контейнер. Замер на демо-базе:
    # ~250 МБ под всеми страницами и выгрузками, до ~670 МБ на импорте
    # xlsx на пределе распаковки (64 МБ, 2,5 млн строк). 1 ГБ - запас в
    # полтора раза; два таких импорта разом (~1,1 ГБ) в него не влезли бы,
    # поэтому панель импортирует по одному (app.state.import_lock). Упрётся
    # всё же - перезапустится панель, а postgres и бот не заметят. Их не
    # ограничиваем.
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    secrets: [db_password, bot_token, crm_secret, crm_admin_password, tochka_token,
              inbox_key, inbox_hook_token, franchise_key, metrics_token]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      BOT_TOKEN_FILE: /run/secrets/bot_token
      CRM_SECRET_FILE: /run/secrets/crm_secret
      CRM_ADMIN_PASSWORD_FILE: /run/secrets/crm_admin_password
      # Эквайринг: панель ходит в банк ровно за ссылкой на оплату, по
      # нажатию оператора. Опрос статусов остался в процессе бота.
      TOCHKA_TOKEN_FILE: /run/secrets/tochka_token
      INBOX_KEY_FILE: /run/secrets/inbox_key
      INBOX_HOOK_TOKEN_FILE: /run/secrets/inbox_hook_token
      # Франшиза: ключ токенов франчайзи (раздел «Франчайзи», кнопка
      # «Обновить сейчас») и токен своего /hook/metrics для франчайзера.
      FRANCHISE_KEY_FILE: /run/secrets/franchise_key
      METRICS_TOKEN_FILE: /run/secrets/metrics_token

      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-mybike}
      POSTGRES_DB: ${POSTGRES_DB:-mybike}

      CRM_ADMIN_LOGIN: ${CRM_ADMIN_LOGIN:-admin}
      # Та же ссылка, что у бота: панель показывает её в предпросмотре
      # рассылки, чтобы оператор видел то же, что увидит клиент.
      PAY_URL: ${PAY_URL}
      TOCHKA_CUSTOMER_CODE: ${TOCHKA_CUSTOMER_CODE}
      # Служебный чат: панель пишет туда то же, что бот.
      CONTRACT_CHAT_ID: ${CONTRACT_CHAT_ID}
      CRM_TITLE: ${CRM_TITLE:-МАЙБАЙК}
      # Непустой домен = панель за Caddy: адрес клиента из X-Forwarded-For.
      CRM_DOMAIN: ${CRM_DOMAIN:-}
      # Кому верить по X-Forwarded-For. Пусто - частные сети, в которых
      # и живёт compose. «Верить всем» нельзя: uvicorn берёт первый адрес
      # из заголовка, и клиент подставил бы в протокол подписи выдуманный.
      CRM_TRUSTED_PROXIES: ${CRM_TRUSTED_PROXIES:-}
      # Адрес демо-стенда - только для ссылки «обучение новичков» в
      # «Сотрудниках». В демо панель не ходит и его базы не знает.
      DEMO_DOMAIN: ${DEMO_DOMAIN:-}
      # Порт внутри контейнера фиксирован; наружу пробрасывается CRM_PORT.
      CRM_PORT: "8080"
      REMIND_BEFORE_DAYS: ${REMIND_BEFORE_DAYS:-2}
      # Договоры клиентов лежат в хранилище бота; панель отдаёт их на
      # скачивание, поэтому том смонтирован только на чтение.
      STORAGE_DIR: /files/kyc
      # Снимки сверки техники: панель их пишет, поэтому том свой, а
      # kycfiles с персональными данными остаётся read-only.
      BIKE_PHOTO_DIR: /bikes
      DOC_TEMPLATE_DIR: /doctemplates
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${CRM_BIND:-127.0.0.1}:${CRM_PORT:-8080}:8080"
    volumes:
      - kycfiles:/files:ro
      - bikefiles:/bikes
      - doctemplates:/doctemplates
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # HTTPS для панели по домену: docker compose --profile https up -d
  # Caddy сам получает и продлевает сертификат Let's Encrypt. Нужны
  # A-запись CRM_DOMAIN на IP сервера и открытые порты 80/443 в ufw.
  # Второй сайт - демо-стенд на DEMO_DOMAIN, только когда тот задан:
  # `caddy reverse-proxy` умеет один адрес, поэтому Caddyfile собирается
  # при старте. crm-demo нет в depends_on намеренно: без профиля demo
  # compose не поднял бы и Caddy, а так выключенное демо просто отвечает
  # 502 на своём адресе.
  # Демо не может уронить панель: сначала пишется сайт панели, демо
  # дописывается, только если его адрес не совпал с адресом панели и
  # Caddy принял файл целиком (`caddy adapt`); иначе - предупреждение
  # в лог и одна панель. Пределы тела - как у самой панели (BODY_MAX,
  # PHOTOS_BODY_MAX на закрытии аренды - WIDE_BODY_PATHS, DEMO_BODY_MAX
  # в app/web/app.py): большой - только на POST закрытия с фото, остальным,
  # и открытым без входа /login, /sign/, /hook/, - обычный. Таймауты
  # чтения не дают держать недокачанную загрузку открытой часами.
  # read_body - на ВЕСЬ запрос с телом, и у Caddy он один на сервер, по
  # путям не делится: шесть фото при сдаче (до 48 МБ) оператор шлёт с
  # телефона на точке, и при 1 Мбит/с это минут шесть - на двух минутах
  # закрытие обрывалось, не дойдя до панели. Медленный заголовок режет
  # read_header. Лог Caddy - с фильтром: токен в адресе (/hook/inbox/…,
  # /sign/…) заменяется на REDACTED, иначе ошибка прокси писала бы его.
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on: [crm]
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:-}
      DEMO_DOMAIN: ${DEMO_DOMAIN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        site() {
          printf '%s {\n\trequest_body {\n\t\tmax_size %s\n\t}\n\treverse_proxy %s\n}\n' "$$1" "$$3" "$$2"
        }
        # Панель: большой предел - только закрытию аренды с фото.
        panel() {
          wide='path_regexp ^/rentals/[0-9]+/close$$'
          printf '%s {\n\t@wide {\n\t\tmethod POST\n\t\t%s\n\t}\n\t@narrow not {\n\t\tmethod POST\n\t\t%s\n\t}\n\trequest_body @wide {\n\t\tmax_size %s\n\t}\n\trequest_body @narrow {\n\t\tmax_size %s\n\t}\n\treverse_proxy %s\n}\n' \
            "$$1" "$$wide" "$$wide" "$$4" "$$3" "$$2"
        }
        {
          printf '{\n\tservers {\n\t\ttimeouts {\n\t\t\tread_header 10s\n\t\t\tread_body 600s\n\t\t}\n\t}\n'
          # Токен в адресе - не в лог: ошибка прокси (панель перезапускается,
          # 502) пишет запрос с полным uri, а это /hook/inbox/<токен> Wazzup и
          # /sign/<токен> ссылки на подпись. Фильтр - на логгере по
          # умолчанию, куда идут и http.log.error, и reverse_proxy.
          printf '\tlog {\n\t\tformat filter {\n\t\t\tfields {\n\t\t\t\trequest>uri regexp %s /$$1/REDACTED\n\t\t\t}\n\t\t}\n\t}\n}\n' \
            '/(hook/inbox|sign)/[^/?]+'
          if [ -n "$${CRM_DOMAIN}" ]; then panel "$${CRM_DOMAIN}" crm:8080 22MB 51MB; fi
        } > /tmp/Caddyfile
        if [ -n "$${DEMO_DOMAIN}" ]; then
          crm=$$(printf %s "$${CRM_DOMAIN}" | tr A-Z a-z)
          demo=$$(printf %s "$${DEMO_DOMAIN}" | tr A-Z a-z)
          if [ "$$demo" = "$$crm" ]; then
            echo "DEMO_DOMAIN совпадает с CRM_DOMAIN: демо не поднимаю, панель работает" >&2
          else
            cp /tmp/Caddyfile /tmp/Caddyfile.all
            site "$${DEMO_DOMAIN}" crm-demo:8080 1MB >> /tmp/Caddyfile.all
            if caddy adapt --config /tmp/Caddyfile.all --adapter caddyfile >/dev/null; then
              mv /tmp/Caddyfile.all /tmp/Caddyfile
            else
              echo "DEMO_DOMAIN=$${DEMO_DOMAIN} Caddy не принял: демо не поднимаю, панель работает" >&2
            fi
          fi
        fi
        exec caddy run --config /tmp/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddydata:/data
    # Обе сети: боевая - до crm, своя демо - до crm-demo. Одна из
    # немногих точек, где они встречаются, и она ничего не хранит.
    networks: [default, demo]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Демо-стенд для франшизы: та же панель на вымышленных данных.
  #   docker compose --profile demo up -d --build
  # (или demo в COMPOSE_PROFILES - install.sh ставит его сам при DEMO_DOMAIN).
  # Своя база и свои секреты; боевых ключей, томов и бота у демо нет
  # намеренно: логин публичен, и дыра в демо не должна доставать ни до
  # настоящих клиентов (152-ФЗ), ни до Telegram и банка. consistency.py
  # проверяет, что сюда не попал ни боевой секрет, ни боевой том.
  # Данные пересеиваются при старте и каждую ночь в 04:00 по Москве.
  # Сеть у демо своя (demo): из неё не видно ни postgres, ни crm, ни бота,
  # так что даже дыра с выполнением кода в демо упирается в сеть, а не
  # только в отсутствие паролей. consistency.py проверяет и это.
  postgres-demo:
    image: postgres:16-alpine
    profiles: [demo]
    restart: unless-stopped
    networks: [demo]
    secrets: [demo_db_password]
    environment:
      POSTGRES_USER: mybike_demo
      POSTGRES_PASSWORD_FILE: /run/secrets/demo_db_password
      POSTGRES_DB: mybike_demo
      TZ: ${TZ:-Europe/Moscow}
    # Свой том: бэкап его не берёт - демо пересеивается каждую ночь.
    volumes:
      - pgdata_demo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mybike_demo -d mybike_demo"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  crm-demo:
    build: .
    profiles: [demo]
    restart: unless-stopped
    command: ["python", "-m", "app.demo"]
    depends_on:
      postgres-demo:
        condition: service_healthy
    networks: [demo]
    # Демо открыто всем: тяжёлый запрос должен упереться в свой
    # контейнер, а не в память и диск сервера, общие с боевой базой.
    # /tmp - в памяти и маленький: временные файлы форм не пишутся на
    # тот же диск, где лежит pgdata.
    mem_limit: 768m
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m
    secrets: [demo_db_password, crm_demo_secret]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/demo_db_password
      CRM_SECRET_FILE: /run/secrets/crm_demo_secret
      POSTGRES_HOST: postgres-demo
      POSTGRES_USER: mybike_demo
      POSTGRES_DB: mybike_demo
      # Непустой домен = демо за Caddy: Secure cookie, HSTS и адрес
      # клиента из X-Forwarded-For - как у боевой панели.
      CRM_DOMAIN: ${DEMO_DOMAIN:-}
      CRM_TRUSTED_PROXIES: ${CRM_TRUSTED_PROXIES:-}
      CRM_PORT: "8080"
      TZ: ${TZ:-Europe/Moscow}
    # Для SSH-туннеля, пока нет домена; снаружи по-прежнему только Caddy.
    ports:
      - "${DEMO_BIND:-127.0.0.1}:${DEMO_PORT:-8081}:8080"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Бот в MAX. Не поднимается обычным `docker compose up`, пока max нет в
  # COMPOSE_PROFILES (.env): включается там, а не разовым --profile max -
  # bootstrap.sh и update.sh поднимают только профили из COMPOSE_PROFILES.
  #   printf '%s' '<токен от @MasterBot>' > secrets/max_bot_token
  #   COMPOSE_PROFILES="https,max" в .env, затем docker compose up -d --build
  # У него свой токен, свои чаты и своя база mybike_max (создаёт сам);
  # Telegram-бот и его данные не затрагиваются.
  bot-max:
    build: .
    profiles: [max]
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["python", "-m", "app.max_main"]
    depends_on:
      postgres:
        condition: service_healthy
    secrets: [db_password, max_bot_token, pdn_key, inbox_key]
    environment:
      MAX_BOT_TOKEN_FILE: /run/secrets/max_bot_token
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      PDN_KEY_FILE: /run/secrets/pdn_key
      INBOX_KEY_FILE: /run/secrets/inbox_key

      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-mybike}
      POSTGRES_DB: ${POSTGRES_DB:-mybike}
      MAX_POSTGRES_DB: mybike_max
      # Мост в основную базу: MAX-бот проставляет max_id в карточке
      # клиента по телефону, иначе рассылке некуда писать.
      CRM_POSTGRES_DB: ${POSTGRES_DB:-mybike}

      # Адрес Bot API MAX. Меняется только если dev.max.ru объявит другой.
      MAX_API_BASE: ${MAX_API_BASE:-https://botapi.max.ru}

      MAX_CHANNEL_ID: ${MAX_CHANNEL_ID}
      MAX_CHANNEL_URL: ${MAX_CHANNEL_URL}
      MAX_ADMIN_CHAT_ID: ${MAX_ADMIN_CHAT_ID}
      MAX_ADMINS: ${MAX_ADMINS}
      MAX_CONTRACT_CHAT_ID: ${MAX_CONTRACT_CHAT_ID}
      MAX_FIX_CHAT_ID: ${MAX_FIX_CHAT_ID}
      MAX_CONTRACT_PREFIX: ${MAX_CONTRACT_PREFIX:-АВМ}

      CONTRACT_TEMPLATE: /srv/app/contract_template.docx
      OFERTA_URL: ${OFERTA_URL}
      OFERTA_VERSION: ${OFERTA_VERSION}
      PDN_URL: ${PDN_URL}
      PDN_VERSION: ${PDN_VERSION}
      VIDEO_URL: ${VIDEO_URL}

      PURGE_APPROVED_DAYS: ${PURGE_APPROVED_DAYS:-90}
      PURGE_REJECTED_DAYS: ${PURGE_REJECTED_DAYS:-3}
      PURGE_STALE_DAYS: ${PURGE_STALE_DAYS:-30}
      UPDATES_LOG_DAYS: ${UPDATES_LOG_DAYS:-7}
      REMIND_BEFORE_DAYS: ${REMIND_BEFORE_DAYS:-2}
      REMIND_HOUR_UTC: ${REMIND_HOUR_UTC:-7}

      # Отдельный каталог: сканы из MAX не смешиваются со сканами из Telegram
      MAX_STORAGE_DIR: /files/kyc-max
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - kycfiles:/files
      - ./app/contract_template.docx:/srv/app/contract_template.docx:ro
      # Свой шаблон договора, подпись и печать владельца - как у бота
      # Telegram: панель пишет, MAX-бот только читает (DOC_TEMPLATE_DIR
      # по умолчанию /doctemplates).
      - doctemplates:/doctemplates:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  pgdata:
  kycfiles:
  # Снимки техники: сверка и фото при сдаче. Персональных данных в них
  # нет. У снимков сверки нет и срока хранения - номер на раме не
  # устаревает; фото при сдаче живут return_photo_days (по умолчанию 180).
  # Пишут панель и бот (фото из служебного чата), оба под uid 10001.
  bikefiles:
  # Загруженные владельцем шаблоны договора и актов, подпись и
  # печать. Панель пишет, бот читает: том общий, права разные.
  doctemplates:
  caddydata:
  # База демо-стенда. Отдельно от pgdata: демо сносит свои схемы каждую ночь.
  pgdata_demo:

# default - боевые сервисы; demo - только демо-стенд и Caddy перед ним.
# Сеть demo не internal: порт crm-demo для SSH-туннеля иначе не
# опубликовать.
networks:
  default: {}
  demo: {}
