[project]
name = "mybike-bot"
version = "1.0.0"
description = "Telegram-бот регистрации с проверкой подписки, KYC и модерацией"
requires-python = ">=3.11"
# Список лежит в requirements.txt: Dockerfile ставит его напрямую, и держать
# те же строки ещё и здесь - гарантированный источник расхождений.
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = ["app", "app.handlers", "app.services", "app.i18n", "app.max",
            "app.crm", "app.web"]

[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "static/*.css", "static/fonts/*.woff2"]

[project.scripts]
bot = "app.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
# ASYNC109/ASYNC240 советуют trio/anyio-обёртки (timeout-параметр, Path
# в async def); проект на чистом asyncio, а чтение файлов там - один раз
# на старте.
ignore = ["ASYNC109", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
# Языковые пакеты - длинные строки переводов; переносить их значит
# рисковать текстом, который читают клиенты.
"app/i18n/*.py" = ["E501"]
"app/faq_i18n.py" = ["E501"]
