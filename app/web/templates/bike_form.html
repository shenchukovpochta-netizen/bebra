{% extends "base.html" %}
{% block content %}
<div class="card narrow">
<h1>Новый велосипед</h1>
<form method="post" action="/bikes">
  <label>Инвентарный номер <input name="code" placeholder="B-012" required></label>
  <label>Модель <input name="model" placeholder="Kugoo V3 Pro" required></label>
  <label>Номер рамы <input name="frame_no"></label>
  <label>Номер мотора <input name="motor_no"></label>
  <label>АКБ, шт. <input name="battery_count" type="number" min="0" max="10" value="2"></label>
  <label>Пробег, км <input name="mileage_km" inputmode="numeric" placeholder="0"></label>
  <label>Точка <select name="location"><option value="">не на точке</option>{% for loc in LOCATIONS %}<option value="{{ loc }}">{{ loc }}</option>{% endfor %}</select></label>
  <label class="check"><input type="checkbox" name="spare" value="1" > Подменный: держим под замены, а не под выдачу</label>
  <label>Цена покупки <input name="purchase_price" inputmode="decimal"></label>
  <label>Дата покупки <input name="purchased_on" type="date"></label>
  <label>Срок службы, мес. <input name="service_months" type="number" min="1" max="240" value="24"></label>
  <label>Остаточная стоимость <input name="residual_price" inputmode="decimal" placeholder="0"></label>
  <label>Цена одной АКБ <input name="battery_price" inputmode="decimal" placeholder="для амортизации"></label>
  <label>Срок службы АКБ, мес. <input name="battery_service_months" type="number" min="1" max="240" value="15"></label>
  <label>Заметка <textarea name="note" rows="3"></textarea></label>
  <button type="submit">Сохранить</button>
</form>
<p class="muted">Номер рамы стоит заполнить: по нему бот находит велосипед из формы выдачи оператора и не заводит дубль.</p>
</div>
{% endblock %}
